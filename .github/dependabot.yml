version: 2
# Dependabot is configured but PR creation is disabled (limit 0) — the
# initial run flooded the repo with 10+ PRs. To re-enable version-update PRs
# (one grouped PR per ecosystem), set open-pull-requests-limit back to 5.
# Security alerts are unaffected by this limit.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      docker-base-images:
        patterns: ["*"]
