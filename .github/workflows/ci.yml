name: ci

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.8.0
          test -z "$(gofumpt -l .)" || { echo "gofumpt needed on:"; gofumpt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Must be built with a Go version >= the go.mod target (1.26.6).
          # v2.1.6 is built with go1.24 and refuses to load the config.
          version: v2.13.2

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  integration:
    name: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: integration tests
        run: make test-integration

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: build image
        run: docker build -t mobiscope:ci .

      - name: smoke test toolchain
        run: |
          docker run --rm --entrypoint sh mobiscope:ci -c '
            set -e
            mobiscope version
            gitleaks version
            apktool --version
            jadx --version
            semgrep --version
          '

      - name: smoke test serve
        run: |
          docker run -d --name mobiscope-ci -p 127.0.0.1:18080:8080 mobiscope:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker logs mobiscope-ci
          docker rm -f mobiscope-ci

  macos-ios-tools:
    name: macos-ios-tools
    runs-on: macos-latest
    # Soft-fail: exercises darwin-only tools (otool/codesign/plutil/ditto/
    # class-dump) without blocking the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: darwin tool versions
        run: |
          xcrun otool 2>&1 | head -1 || true
          codesign --version 2>&1 | head -1 || true
          plutil -help 2>&1 | head -1 || true
          ditto 2>&1 | head -1 || true
          command -v class-dump >/dev/null 2>&1 && class-dump --version 2>&1 | head -1 || echo "class-dump not installed (optional)"

      - name: iOS analyzer tests (darwin subset)
        run: go test ./internal/analyzers/ -run 'Plist|CodeSign|MachO|Classdump|ClassDump|IOS|IPAExtract|InventoryIOS' -count=1

      - name: platform tests
        run: go test ./internal/platform/ -count=1
