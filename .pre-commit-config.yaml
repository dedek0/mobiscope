# Optional pre-commit hooks: run `pre-commit install` once to enable them,
# or check everything manually with `pre-commit run --all-files`.
# Go fmt/vet/lint stay in `make check` — these hooks only cover repo hygiene.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
        # samples/ and fixture APKs/IPAs are gitignored (*.apk/*.ipa), but
        # never flag them if someone force-adds them.
        exclude: "^(samples/|\\.smoke-fixtures/).*|\\.(apk|ipa)$"
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
